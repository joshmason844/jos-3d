<!doctype html>
<html lang="en">
<head>

<title>Main Hall in 3D</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>

.lb{position:absolute;transform:translate(-50%,-100%);font:500 .58rem/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(5,11,22,.72);border:1px solid rgba(22,180,255,.45);padding:4px 6px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lb.ns{border-color:rgba(226,183,102,.7)}
#card .meta{margin-top:6px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute)}
#card .meta b{color:var(--brass);font-weight:500}

#thumbs img{height:84px;border:1px solid var(--line);cursor:pointer}
#viewer{position:fixed;inset:0;background:rgba(2,6,12,.92);display:none;align-items:center;justify-content:center;z-index:9}
#viewer img{max-width:94vw;max-height:86vh}
#viewer span{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:500 .7rem 'IBM Plex Mono',monospace;color:var(--mute)}
#pmix{display:none;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 10px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#pmix input{width:130px;accent-color:#3dff8a}
#photoBg{position:fixed;display:none;pointer-events:none;z-index:0}
#c{z-index:1}
#secs{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;z-index:3}
#secs button{background:var(--glass);border:1px solid var(--line);color:var(--ink);font:500 .62rem/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;cursor:pointer;text-align:left}
#secs button.on{border-color:var(--green);color:var(--green)}
@media (max-width:640px){#secs{top:auto;bottom:calc(118px + env(safe-area-inset-bottom));right:10px}#secs button{padding:6px 8px;font-size:.56rem}}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="labels"></div>
<div class="top"><div class="tag"><h1>Main hall · all sections</h1><p>The five detailed sections, each fitted to one of your photos, put back together in the hall with the kit between them. Fly to a section on the right; tap anything to see what it is and the photos it's in. Orange labels = not sure. Section pages have the photo blend.</p></div>
<div id="card" hidden><button id="cardX" aria-label="close">×</button><h2 id="cName"></h2><p id="cWhat"></p><div class="meta" id="cMeta"></div><div id="thumbs"></div></div></div>
<div id="secs"></div>
<div class="bar"><button id="vDoor" class="on">walk in</button><button id="vFar">far end</button><button id="vTop">from above</button><button id="inside">look inside</button><button id="vLab" class="on">labels</button><button id="spin">spin</button></div>
<div id="viewer"><img id="vImg" alt=""><span id="vCap"></span></div>
<script id="th" type="application/json">__THUMBS__</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>

const selBox = new THREE.Box3Helper(new THREE.Box3(), 0x3dff8a); selBox.visible = false; selBox.material.depthTest = false; selBox.renderOrder = 9; scene.add(selBox); let selO = null;

  $('card').hidden = false; selBox.box.setFromObject(o); selBox.visible = true; }
$('viewer').onclick = () => $('viewer').style.display = 'none'; $('cardX').onclick = () => select(null);
const ray = new THREE.Raycaster(); let down;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; controls.autoRotate = false; $('spin').classList.remove('on'); fly = null; });
