<style>

#photoBg{position:fixed;display:none;pointer-events:none;z-index:0}
#c{z-index:1}

@media (max-width:640px){#secs{top:auto;bottom:calc(118px + env(safe-area-inset-bottom));right:10px}#secs button{padding:6px 8px;font-size:.56rem}}
