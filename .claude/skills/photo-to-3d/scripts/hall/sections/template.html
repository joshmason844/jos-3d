<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050b16;--glass:rgba(11,21,48,.76);--line:rgba(159,180,204,.22);--ink:#eaf3ff;--mute:#9fb4cc;--blue:#16b4ff;--brass:#e2b766;--green:#3dff8a}

#stage{position:fixed;inset:0}
#photo{position:absolute;display:none;object-fit:fill;pointer-events:none}

.top{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}

.tag{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);max-width:min(520px,calc(100vw - 32px))}

#card{max-width:min(420px,calc(100vw - 32px));background:var(--glass);border:1px solid rgba(61,255,138,.45);border-left:3px solid var(--green);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 34px 10px 14px;position:relative}

#cardX{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:4px 6px}

.bar button{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);padding:11px 13px;min-height:40px}
#x{display:none;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 10px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#y{width:120px;accent-color:#3dff8a}
@media (max-width:640px){.parts{top:auto;bottom:calc(120px + env(safe-area-inset-bottom));right:12px;max-height:34vh}.parts button{padding:7px 9px;font-size:.6rem}}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font:500 .58rem/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(5,11,22,.72);border:1px solid rgba(22,180,255,.45);padding:4px 6px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lb.ns{border-color:rgba(226,183,102,.7)}
#card .meta{margin-top:6px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute)}
#card .meta b{color:var(--brass);font-weight:500}
#thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
#thumbs img{height:84px;border:1px solid var(--line);cursor:pointer}
#viewer{position:fixed;inset:0;background:rgba(2,6,12,.92);display:none;align-items:center;justify-content:center;z-index:9}
#viewer img{max-width:94vw;max-height:86vh}
#viewer span{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:500 .7rem 'IBM Plex Mono',monospace;color:var(--mute)}
#pmix{display:none;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 10px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#pmix input{width:130px;accent-color:#3dff8a}
#photoBg{position:fixed;display:none;pointer-events:none;z-index:0}
#c{z-index:1}
</style>
</head>
<body>
<img id="photoBg" alt=""><canvas id="c"></canvas><div id="labels"></div>

<script id="ph" type="text/plain">__PHOTO__</script>
