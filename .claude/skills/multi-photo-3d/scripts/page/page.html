<style>

.bar button{background:var(--glass);border:1px solid var(--line);color:var(--ink);font:500 .74rem/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;min-height:40px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}

</style>
</head>
