<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>People in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050b16;--glass:rgba(11,21,48,.76);--line:rgba(159,180,204,.22);--ink:#eaf3ff;--mute:#9fb4cc;--blue:#16b4ff;--brass:#e2b766;--green:#3dff8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--void:#050b16}}
:root[data-theme="dark"]{--void:#050b16}
html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font:400 15px/1.4 'IBM Plex Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#photo{position:absolute;display:none;object-fit:fill;pointer-events:none}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.tag{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);max-width:min(520px,calc(100vw - 32px))}
.tag h1{margin:0;font:700 1.35rem/1 Rajdhani,'Arial Narrow',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tag p{margin:5px 0 0;font:400 .7rem/1.4 'IBM Plex Mono',monospace;color:var(--mute)}
#card{max-width:min(420px,calc(100vw - 32px));background:var(--glass);border:1px solid rgba(61,255,138,.45);border-left:3px solid var(--green);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 34px 10px 14px;position:relative}
#card[hidden]{display:none}
#card h2{margin:0;font:700 1.05rem/1.1 Rajdhani,'Arial Narrow',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--green)}
#card p{margin:5px 0 0;font:400 .8rem/1.4 'IBM Plex Sans',sans-serif}
#cardX{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:4px 6px}
.parts{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;z-index:3;max-height:60vh;overflow:auto}
.parts button,.bar button{background:var(--glass);border:1px solid var(--line);color:var(--ink);font:500 .66rem/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:9px 11px;cursor:pointer;text-align:left;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.parts button.on,.bar button.on{border-color:var(--green);color:var(--green)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;z-index:3}
.bar button{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);padding:11px 13px;min-height:40px}
#x{display:none;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 10px;font:500 .64rem 'IBM Plex Mono',monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
#y{width:120px;accent-color:#3dff8a}
@media (max-width:640px){.parts{top:auto;bottom:calc(120px + env(safe-area-inset-bottom));right:12px;max-height:34vh}.parts button{padding:7px 9px;font-size:.6rem}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="top"><div class="tag"><h1>People · 3D test</h1><p id="meta">Two people from your yard videos, sculpted at real height (read against the forklift guard, 2.16 m): one smooth skin with a carved face, hair and beard grown strand-clump by clump, clothes with folds. A sculpt, not a face scan. Tap a part.</p></div>
<div id="card" hidden><button id="cardX" aria-label="close">×</button><h2 id="cName"></h2><p id="cWhat"></p></div></div>
<div class="parts" id="parts"></div>
<div class="bar"><button id="pGrey">grey tee</button><button id="pKdk">KDK tee</button><button id="pBoth" class="on">side by side</button><button id="spin" class="on">spin</button><button id="ruler" class="on">height post</button><button id="home">reset</button></div>
<script id="pd" type="text/plain">__DATA__</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
__PEOPLE__
const D = await loadPeople(document.getElementById('pd').textContent);
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050b16); scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .55;
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(3, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1 }); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x3a3a36, 1.1)); const rim = new THREE.DirectionalLight(0x9fd0ff, 1.2); rim.position.set(-3, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x0b1424, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(30, 60, 0x16b4ff, 0x123050); grid.material.transparent = true; grid.material.opacity = .3; grid.position.y = .002; scene.add(grid);
// the two people, each a separate model
const P = { grey: buildPerson(D.grey), kdk: buildPerson(D.kdk) }; const CREW = D;
for (const p of Object.values(P)) { p.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(p); }
const NOTES = {
  grey: { Skin: 'One smooth skin: carved face (brow, cheekbones, nose, lips, ears), neck, arms and hands with fingers. Standing arms-out like in the video.', Eyes: 'Light blue eyes.', Hair: 'Fair hair swept up and back, short at the sides, lighter at the tips.', Beard: 'Full ginger-brown beard and moustache.', 'T-shirt': 'Sage-grey crew-neck tee, worn loose, with folds.', Trousers: 'Loose black trousers.', Trainers: 'White trainers.' },
  kdk: { Skin: 'One smooth skin: carved face, light stubble, neck, arms and open hands (palms up, like his pose in your new video).', Eyes: 'Dark brown eyes.', Hair: 'Dark brown, messy and tousled: up and over to one side, fuller on top.', 'T-shirt': 'White boxy tee with a small KDK logo on the left chest.', Trousers: 'Charcoal joggers, elastic cuffs, white drawstring.', Trainers: 'Grey trainers, dark soles.' } };
// height post: black and yellow, marked every 10 cm, numbers every 50 cm
const post = new THREE.Group(); scene.add(post);
{ const c = document.createElement('canvas'); c.width = 64; c.height = 1024; const x = c.getContext('2d'); for (let i = 0; i < 20; i++) { x.fillStyle = i % 2 ? '#111' : '#f2c230'; x.fillRect(0, 1024 - (i + 1) * 51.2, 64, 51.2); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.BoxGeometry(.04, 2, .04), new THREE.MeshStandardMaterial({ map: t, roughness: .6 })); m.position.y = 1; m.castShadow = true; post.add(m);
  for (const h of [.5, 1, 1.5, 2]) { const lc = document.createElement('canvas'); lc.width = 128; lc.height = 48; const lx = lc.getContext('2d'); lx.fillStyle = '#3dff8a'; lx.font = '500 30px IBM Plex Mono, monospace'; lx.fillText(h.toFixed(1) + ' m', 4, 34);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), depthTest: false })); sp.scale.set(.24, .09, 1); sp.position.set(.16, h, 0); post.add(sp); } }
const tops = {}; for (const [k, p] of Object.entries(P)) { const lc = document.createElement('canvas'); lc.width = 256; lc.height = 48; const lx = lc.getContext('2d'); lx.fillStyle = '#eaf3ff'; lx.font = '500 28px IBM Plex Mono, monospace'; lx.fillText(CREW[k].height.toFixed(2) + ' m', 4, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), depthTest: false })); sp.scale.set(.42, .08, 1); sp.position.set(.12, CREW[k].height + .08, 0); p.add(sp); tops[k] = sp; }
const camera = new THREE.PerspectiveCamera(30, 1, .05, 100);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.4; controls.maxPolarAngle = Math.PI * .52; controls.minDistance = .5; controls.maxDistance = 10;
let who = 'both';
function show(w) { who = w; $('pGrey').classList.toggle('on', w === 'grey'); $('pKdk').classList.toggle('on', w === 'kdk'); $('pBoth').classList.toggle('on', w === 'both');
  P.grey.visible = w !== 'kdk'; P.kdk.visible = w !== 'grey'; P.grey.position.x = w === 'both' ? -.55 : 0; P.kdk.position.x = w === 'both' ? .6 : 0; post.position.x = w === 'both' ? -1.15 : -.6; post.position.z = 0;
  pick(null); listParts(); home(); }
function home() { const both = who === 'both'; camera.position.set(both ? .7 : .45, 1.45, both ? 5.6 : 4.2); controls.target.set(0, 1.12, 0); controls.update(); }
const sel = new THREE.Box3Helper(new THREE.Box3(), 0x3dff8a); sel.material.depthTest = false; sel.renderOrder = 9; sel.visible = false; scene.add(sel); let selG = null;
function pick(g, key) { selG = g; document.querySelectorAll('#parts button').forEach(b => b.classList.toggle('on', b._g === g)); if (!g) { $('card').hidden = true; sel.visible = false; return; }
  key = key || Object.keys(P).find(k => P[k].userData.parts[g.name] === g); $('cName').textContent = `${CREW[key].label} · ${g.name}`; $('cWhat').textContent = NOTES[key][g.name] || ''; $('card').hidden = false; sel.box.setFromObject(g); sel.visible = true; }
function listParts() { $('parts').innerHTML = ''; for (const k of who === 'both' ? ['grey', 'kdk'] : [who]) for (const [n, g] of Object.entries(P[k].userData.parts)) { const b = document.createElement('button'); b.textContent = (who === 'both' ? (k === 'grey' ? 'grey · ' : 'KDK · ') : '') + n; b._g = g; b.onclick = () => pick(selG === g ? null : g, k); $('parts').appendChild(b); } }
$('cardX').onclick = () => pick(null);
$('pGrey').onclick = () => show('grey'); $('pKdk').onclick = () => show('kdk'); $('pBoth').onclick = () => show('both');
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); };
$('ruler').onclick = () => { post.visible = !post.visible; $('ruler').classList.toggle('on', post.visible); };
$('home').onclick = () => home();
const ray = new THREE.Raycaster(); let down;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; controls.autoRotate = false; $('spin').classList.remove('on'); });
renderer.domElement.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera); const h = ray.intersectObjects([P.grey, P.kdk].filter(p => p.visible), true).find(h => !h.object.isSprite);
  let o = h && h.object; while (o && !(o.parent && o.parent.userData.parts)) o = o.parent; pick(o || null); });
function layout() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < .8 ? 44 : 30; camera.updateProjectionMatrix(); }
addEventListener('resize', layout); layout(); show('both');
renderer.setAnimationLoop(() => { if (sel.visible && selG) sel.box.setFromObject(selG); controls.update(); renderer.render(scene, camera); });
window.__show = show; window.__pick = (k, n) => pick(P[k].userData.parts[n], k); window.__cam = (p, t) => { controls.autoRotate = false; camera.position.fromArray(p); controls.target.fromArray(t); controls.update(); }; window.__ready = true;
</script>
</body>
</html>
